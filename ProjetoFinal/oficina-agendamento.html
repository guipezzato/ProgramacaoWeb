<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFix — Agendamento de Serviços</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #ff4500;
    --accent2: #ff6b35;
    --gold: #f5a623;
    --text: #f0ece4;
    --muted: #6b6b6b;
    --success: #22c55e;
    --danger: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- BACKGROUND TEXTURE ---- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,.015) 60px, rgba(255,255,255,.015) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,.015) 60px, rgba(255,255,255,.015) 61px);
    pointer-events: none;
    z-index: 0;
  }

  /* ---- HEADER ---- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 72px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .logo-text span { color: var(--accent); }

  .header-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ---- HERO STRIP ---- */
  .hero-strip {
    background: linear-gradient(135deg, #1a0800 0%, #0d0d0d 50%, #0d1a00 100%);
    border-bottom: 2px solid var(--accent);
    padding: 48px 40px;
    position: relative;
    overflow: hidden;
    z-index: 1;
  }

  .hero-strip::after {
    content: 'AGENDE JÁ';
    font-family: 'Bebas Neue', sans-serif;
    font-size: 160px;
    color: rgba(255,69,0,.04);
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 10px;
  }

  .hero-strip h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: 3px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .hero-strip h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .hero-strip p {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  /* ---- MAIN LAYOUT ---- */
  main {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 40px;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 32px;
    align-items: start;
  }

  /* ---- PANEL ---- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .panel-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    color: var(--text);
  }

  .panel-title span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--accent);
    background: rgba(255,69,0,.12);
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 10px;
    letter-spacing: 1px;
  }

  .panel-body { padding: 24px; }

  /* ---- CALENDAR ---- */
  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .calendar-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .calendar-nav button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .calendar-month {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-weekday {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 8px 0;
    text-transform: uppercase;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
    transition: all .15s;
    color: var(--text);
  }

  .cal-day:hover:not(.disabled):not(.empty) {
    background: var(--surface2);
    border-color: var(--border);
  }

  .cal-day.empty { cursor: default; }

  .cal-day.disabled {
    color: var(--muted);
    cursor: not-allowed;
    opacity: .4;
  }

  .cal-day.today {
    border-color: var(--gold);
    color: var(--gold);
  }

  .cal-day.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .cal-day.has-appt::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent2);
  }

  .cal-day.selected.has-appt::after { background: #fff; }

  /* ---- HORÁRIOS ---- */
  .time-section {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .time-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .time-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .time-slot {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
    transition: all .15s;
  }

  .time-slot:hover:not(.taken) {
    border-color: var(--accent);
    color: var(--accent);
  }

  .time-slot.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .time-slot.taken {
    opacity: .35;
    cursor: not-allowed;
    text-decoration: line-through;
  }

  /* ---- FORM SIDE ---- */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    position: sticky;
    top: 88px;
  }

  .form-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(255,69,0,.1), transparent);
  }

  .form-body { padding: 24px; }

  label {
    display: block;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
    margin-top: 16px;
  }

  label:first-child { margin-top: 0; }

  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  select option { background: var(--surface2); }
  textarea { resize: none; height: 72px; }

  .selection-display {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .selection-display.empty { color: var(--muted); font-size: 11px; }

  /* ---- BUTTONS ---- */
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    transition: all .2s;
    margin-top: 20px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
  }

  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  /* ---- AGENDA LIST ---- */
  .agenda-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .agenda-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color .2s;
    animation: slideIn .3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .agenda-item:hover { border-color: #333; }

  .agenda-date-box {
    background: var(--accent);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
    min-width: 52px;
    flex-shrink: 0;
  }

  .agenda-date-box .day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    line-height: 1;
    color: #fff;
  }

  .agenda-date-box .month {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: rgba(255,255,255,.8);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .agenda-info { flex: 1; min-width: 0; }

  .agenda-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .agenda-detail {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .agenda-detail .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: rgba(255,255,255,.05);
    border-radius: 4px;
    padding: 2px 6px;
    color: var(--gold);
  }

  .agenda-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all .15s;
    color: var(--text);
  }

  .icon-btn.edit:hover { border-color: var(--gold); color: var(--gold); background: rgba(245,166,35,.1); }
  .icon-btn.del:hover  { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,.1); }

  /* ---- EMPTY STATE ---- */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ---- MODAL ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 460px;
    max-width: calc(100vw - 32px);
    padding: 32px;
    transform: scale(.95) translateY(12px);
    transition: transform .25s;
  }

  .modal-backdrop.open .modal {
    transform: scale(1) translateY(0);
  }

  .modal h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions .btn {
    margin-top: 0;
    flex: 1;
  }

  /* ---- TOAST ---- */
  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 300;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--success);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 500;
    min-width: 260px;
    transform: translateY(80px);
    opacity: 0;
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { border-left-color: var(--danger); }

  /* ---- STATS ROW ---- */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    flex: 1;
    min-width: 130px;
  }

  .stat-card .val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--accent);
    line-height: 1;
  }

  .stat-card .lbl {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 4px;
  }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      padding: 24px 16px;
    }
    .form-card { position: static; }
    header { padding: 0 16px; }
    .hero-strip { padding: 32px 16px; }
    .hero-strip h1 { font-size: 36px; }
    .hero-strip::after { font-size: 80px; }
    .time-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔧</div>
    <div class="logo-text">AUTO<span>FIX</span></div>
  </div>
  <div class="header-badge">SISTEMA DE AGENDAMENTO v1.0</div>
</header>

<div class="hero-strip">
  <h1>AGENDE SEU<br><em>SERVIÇO</em></h1>
  <p>Escolha data e horário disponíveis • Rápido e sem complicação</p>
</div>

<main>
  <!-- LEFT COLUMN -->
  <div>
    <!-- STATS -->
    <div class="stats-row" id="statsRow"></div>

    <!-- CALENDAR -->
    <div class="panel" style="margin-bottom:24px">
      <div class="panel-header">
        <div class="panel-title">Calendário <span id="calMonthBadge"></span></div>
      </div>
      <div class="panel-body">
        <div class="calendar-nav">
          <button onclick="changeMonth(-1)">&#8592;</button>
          <div class="calendar-month" id="calMonthLabel"></div>
          <button onclick="changeMonth(1)">&#8594;</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
        <div class="time-section" id="timeSection" style="display:none">
          <div class="time-label" id="timeSectionLabel"></div>
          <div class="time-grid" id="timeGrid"></div>
        </div>
      </div>
    </div>

    <!-- AGENDA LIST -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Agendamentos <span id="totalBadge">0</span></div>
      </div>
      <div class="panel-body">
        <div class="agenda-list" id="agendaList"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN — FORM -->
  <div class="form-card">
    <div class="form-header">
      <div class="panel-title" id="formTitle">Novo Agendamento</div>
    </div>
    <div class="form-body">
      <label>Data Selecionada</label>
      <div class="selection-display empty" id="dateDisplay">Clique em um dia no calendário</div>

      <label>Horário Selecionado</label>
      <div class="selection-display empty" id="timeDisplay">Selecione o horário</div>

      <label>Nome do Cliente</label>
      <input type="text" id="clientName" placeholder="Ex: João Silva">

      <label>Telefone</label>
      <input type="text" id="clientPhone" placeholder="(11) 99999-9999">

      <label>Veículo</label>
      <input type="text" id="clientVehicle" placeholder="Ex: Honda Civic 2020">

      <label>Serviço</label>
      <select id="serviceType">
        <option value="">— Selecionar —</option>
        <option value="Revisão Geral">Revisão Geral</option>
        <option value="Troca de Óleo">Troca de Óleo</option>
        <option value="Alinhamento e Balanceamento">Alinhamento e Balanceamento</option>
        <option value="Freios">Freios</option>
        <option value="Suspensão">Suspensão</option>
        <option value="Sistema Elétrico">Sistema Elétrico</option>
        <option value="Ar Condicionado">Ar Condicionado</option>
        <option value="Diagnóstico Computadorizado">Diagnóstico Computadorizado</option>
        <option value="Outros">Outros</option>
      </select>

      <label>Observações (opcional)</label>
      <textarea id="obsField" placeholder="Informe detalhes adicionais…"></textarea>

      <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">CONFIRMAR AGENDAMENTO</button>
      <button class="btn btn-secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none">Cancelar edição</button>
    </div>
  </div>
</main>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h2>Editar Agendamento</h2>

    <label>Data</label>
    <div class="selection-display" id="editDateDisplay" style="color:var(--text)">—</div>

    <label>Horário</label>
    <div id="editTimeGrid" class="time-grid" style="margin-top:0"></div>

    <label>Nome do Cliente</label>
    <input type="text" id="editName">

    <label>Telefone</label>
    <input type="text" id="editPhone">

    <label>Veículo</label>
    <input type="text" id="editVehicle">

    <label>Serviço</label>
    <select id="editService">
      <option value="">— Selecionar —</option>
      <option>Revisão Geral</option>
      <option>Troca de Óleo</option>
      <option>Alinhamento e Balanceamento</option>
      <option>Freios</option>
      <option>Suspensão</option>
      <option>Sistema Elétrico</option>
      <option>Ar Condicionado</option>
      <option>Diagnóstico Computadorizado</option>
      <option>Outros</option>
    </select>

    <label>Observações</label>
    <textarea id="editObs"></textarea>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit()">SALVAR</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let appointments = JSON.parse(localStorage.getItem('autofix_appointments') || '[]');
let currentDate = new Date();
let viewYear = currentDate.getFullYear();
let viewMonth = currentDate.getMonth();
let selectedDateStr = null;
let selectedTime = null;
let editingId = null;
let editSelectedTime = null;

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const WEEKDAYS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const HOURS = ['07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30'];

// ─── SAVE ─────────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('autofix_appointments', JSON.stringify(appointments));
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function fmtDate(str) {
  const [y, m, d] = str.split('-');
  return `${d}/${m}/${y}`;
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function today() {
  return dateKey(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
}

function takenSlots(dateStr, excludeId=null) {
  return appointments.filter(a => a.date === dateStr && a.id !== excludeId).map(a => a.time);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
  el.className = 'toast' + (type === 'error' ? ' error' : '') + ' show';
  setTimeout(() => el.classList.remove('show'), 3200);
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function renderStats() {
  const total = appointments.length;
  const todayStr = today();
  const todayCount = appointments.filter(a => a.date === todayStr).length;
  const thisMonth = appointments.filter(a => a.date.startsWith(`${viewYear}-${String(viewMonth+1).padStart(2,'0')}`)).length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="val">${total}</div><div class="lbl">Total</div></div>
    <div class="stat-card"><div class="val">${todayCount}</div><div class="lbl">Hoje</div></div>
    <div class="stat-card"><div class="val">${thisMonth}</div><div class="lbl">Este Mês</div></div>
  `;
  document.getElementById('totalBadge').textContent = total;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
  document.getElementById('calMonthBadge').textContent = MONTHS_SHORT[viewMonth];

  const grid = document.getElementById('calGrid');
  grid.innerHTML = WEEKDAYS.map(w => `<div class="cal-weekday">${w}</div>`).join('');

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = today();

  // empty cells
  for(let i = 0; i < firstDay; i++) {
    grid.innerHTML += `<div class="cal-day empty"></div>`;
  }

  for(let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const isPast = key < todayStr;
    const isToday = key === todayStr;
    const isSel = key === selectedDateStr;
    const hasAppt = appointments.some(a => a.date === key);
    const dow = new Date(viewYear, viewMonth, d).getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isDisabled = isPast || isWeekend;

    let cls = 'cal-day';
    if(isDisabled) cls += ' disabled';
    if(isToday) cls += ' today';
    if(isSel) cls += ' selected';
    if(hasAppt) cls += ' has-appt';

    grid.innerHTML += `<div class="${cls}" onclick="${isDisabled ? '' : `selectDay('${key}')`}">${d}</div>`;
  }
}

function changeMonth(dir) {
  viewMonth += dir;
  if(viewMonth < 0) { viewMonth = 11; viewYear--; }
  if(viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
  renderStats();
}

// ─── SELECT DAY ───────────────────────────────────────────────────────────────
function selectDay(key) {
  selectedDateStr = key;
  selectedTime = null;
  document.getElementById('timeDisplay').textContent = 'Selecione o horário';
  document.getElementById('timeDisplay').classList.add('empty');
  renderCalendar();
  renderTimes();
}

// ─── TIME SLOTS ───────────────────────────────────────────────────────────────
function renderTimes() {
  const sec = document.getElementById('timeSection');
  if(!selectedDateStr) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

  const [y, m, d] = selectedDateStr.split('-');
  document.getElementById('timeSectionLabel').textContent = `Horários — ${d}/${m}/${y}`;
  document.getElementById('dateDisplay').textContent = `📅 ${d}/${m}/${y}`;
  document.getElementById('dateDisplay').classList.remove('empty');

  const taken = takenSlots(selectedDateStr);
  const grid = document.getElementById('timeGrid');
  grid.innerHTML = HOURS.map(h => {
    const isTaken = taken.includes(h);
    const isSel = h === selectedTime;
    let cls = 'time-slot';
    if(isTaken) cls += ' taken';
    if(isSel) cls += ' selected';
    return `<div class="${cls}" onclick="${isTaken ? '' : `selectTime('${h}')`}">${h}</div>`;
  }).join('');
}

function selectTime(h) {
  selectedTime = h;
  document.getElementById('timeDisplay').textContent = `🕐 ${h}`;
  document.getElementById('timeDisplay').classList.remove('empty');
  renderTimes();
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
function submitForm() {
  const name = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const vehicle = document.getElementById('clientVehicle').value.trim();
  const service = document.getElementById('serviceType').value;
  const obs = document.getElementById('obsField').value.trim();

  if(!selectedDateStr) return toast('Selecione uma data no calendário.', 'error');
  if(!selectedTime) return toast('Selecione um horário.', 'error');
  if(!name) return toast('Informe o nome do cliente.', 'error');
  if(!vehicle) return toast('Informe o veículo.', 'error');
  if(!service) return toast('Selecione o tipo de serviço.', 'error');

  appointments.push({ id: uid(), date: selectedDateStr, time: selectedTime, name, phone, vehicle, service, obs });
  save();
  toast('Agendamento realizado com sucesso!');
  clearForm();
  renderAll();
}

function clearForm() {
  selectedDateStr = null;
  selectedTime = null;
  ['clientName','clientPhone','clientVehicle','obsField'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('serviceType').value = '';
  document.getElementById('dateDisplay').textContent = 'Clique em um dia no calendário';
  document.getElementById('dateDisplay').classList.add('empty');
  document.getElementById('timeDisplay').textContent = 'Selecione o horário';
  document.getElementById('timeDisplay').classList.add('empty');
  document.getElementById('timeSection').style.display = 'none';
}

// ─── AGENDA LIST ──────────────────────────────────────────────────────────────
function renderAgenda() {
  const list = document.getElementById('agendaList');
  const sorted = [...appointments].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

  if(!sorted.length) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">🗓️</div><p>Nenhum agendamento ainda.<br>Use o formulário ao lado para criar o primeiro.</p></div>`;
    return;
  }

  list.innerHTML = sorted.map(a => {
    const [y, m, d] = a.date.split('-');
    const past = a.date < today();
    return `
    <div class="agenda-item" style="${past ? 'opacity:.5' : ''}">
      <div class="agenda-date-box">
        <div class="day">${d}</div>
        <div class="month">${MONTHS_SHORT[parseInt(m)-1]}</div>
      </div>
      <div class="agenda-info">
        <div class="agenda-name">${a.name}</div>
        <div class="agenda-detail">
          <span class="chip">🕐 ${a.time}</span>
          <span>${a.vehicle}</span>
          <span style="color:var(--accent2)">• ${a.service}</span>
          ${a.phone ? `<span>${a.phone}</span>` : ''}
        </div>
        ${a.obs ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">${a.obs}</div>` : ''}
      </div>
      <div class="agenda-actions">
        <button class="icon-btn edit" onclick="openEdit('${a.id}')" title="Editar">✏️</button>
        <button class="icon-btn del"  onclick="deleteAppt('${a.id}')" title="Excluir">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
function deleteAppt(id) {
  if(!confirm('Confirma a exclusão deste agendamento?')) return;
  appointments = appointments.filter(a => a.id !== id);
  save();
  toast('Agendamento excluído.');
  renderAll();
}

// ─── EDIT MODAL ───────────────────────────────────────────────────────────────
function openEdit(id) {
  const a = appointments.find(x => x.id === id);
  if(!a) return;
  editingId = id;
  editSelectedTime = a.time;

  const [y, m, d] = a.date.split('-');
  document.getElementById('editDateDisplay').textContent = `📅 ${d}/${m}/${y}`;
  document.getElementById('editName').value = a.name;
  document.getElementById('editPhone').value = a.phone || '';
  document.getElementById('editVehicle').value = a.vehicle;
  document.getElementById('editService').value = a.service;
  document.getElementById('editObs').value = a.obs || '';

  renderEditTimes(a.date);
  document.getElementById('editModal').classList.add('open');
}

function renderEditTimes(dateStr) {
  const taken = takenSlots(dateStr, editingId);
  document.getElementById('editTimeGrid').innerHTML = HOURS.map(h => {
    const isTaken = taken.includes(h);
    const isSel = h === editSelectedTime;
    let cls = 'time-slot';
    if(isTaken) cls += ' taken';
    if(isSel) cls += ' selected';
    return `<div class="${cls}" onclick="${isTaken ? '' : `pickEditTime('${h}')`}">${h}</div>`;
  }).join('');
}

function pickEditTime(h) {
  editSelectedTime = h;
  const a = appointments.find(x => x.id === editingId);
  if(a) renderEditTimes(a.date);
}

function saveEdit() {
  const a = appointments.find(x => x.id === editingId);
  if(!a) return;
  const name = document.getElementById('editName').value.trim();
  const vehicle = document.getElementById('editVehicle').value.trim();
  const service = document.getElementById('editService').value;
  if(!name) return toast('Informe o nome.', 'error');
  if(!vehicle) return toast('Informe o veículo.', 'error');
  if(!service) return toast('Selecione o serviço.', 'error');

  a.name = name;
  a.phone = document.getElementById('editPhone').value.trim();
  a.vehicle = vehicle;
  a.service = service;
  a.obs = document.getElementById('editObs').value.trim();
  a.time = editSelectedTime;

  save();
  toast('Agendamento atualizado!');
  closeModal();
  renderAll();
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
  editSelectedTime = null;
}

function cancelEdit() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'Novo Agendamento';
  document.getElementById('submitBtn').textContent = 'CONFIRMAR AGENDAMENTO';
  document.getElementById('cancelEditBtn').style.display = 'none';
  clearForm();
  renderAll();
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll() {
  renderStats();
  renderCalendar();
  renderTimes();
  renderAgenda();
}

// Close modal on backdrop click
document.getElementById('editModal').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

// Phone mask
document.getElementById('clientPhone').addEventListener('input', function() {
  let v = this.value.replace(/\D/g,'').slice(0,11);
  if(v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if(v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else if(v.length) v = `(${v}`;
  this.value = v;
});
document.getElementById('editPhone').addEventListener('input', function() {
  let v = this.value.replace(/\D/g,'').slice(0,11);
  if(v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if(v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else if(v.length) v = `(${v}`;
  this.value = v;
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
