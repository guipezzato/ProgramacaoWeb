<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Pokédex</h1>

        <div class="busca">

            <input
                type="text"
                id="pokemonInput"
                placeholder="Nome ou número do Pokémon"
            >

            <button onclick="buscarPokemon()">
                Buscar
            </button>

        </div>

        <div class="navegacao">

            <button onclick="pokemonAnterior()">
                Anterior
            </button>

            <button onclick="pokemonProximo()">
                Próximo
            </button>

        </div>

        <div id="pokemonCard"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
